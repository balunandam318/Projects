<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Timer</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/a0c992dada.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Back to Portfolio Ribbon -->
    <div class="portfolio-ribbon">
      <a href="../index.html" class="back-btn">
        ← Back to Portfolio
      </a>
    </div>


    <div class="background">
      <div id="initialText" class="container">
        <h1>Kindly Enter your Date of Birth</h1>
      </div>
      <div class="container">
        <div id="afterText" class="center hide">
          <h1>How much life Journey covered, till now</h1>
          <div class="time-container">
            <h2>
              <div id="year">0</div>
              Years
            </h2>
            <h2>
              <div id="month">0</div>
              Months
            </h2>
            <h2>
              <div id="day">0</div>
              Days
            </h2>
            <h2>
              <div id="hour">0</div>
              Hours
            </h2>
            <h2>
              <div id="minute">0</div>
              Minutes
            </h2>
            <h2>
              <div id="second">0</div>
              Seconds
            </h2>
          </div>
        </div>
      </div>

      <div class="settings">
        <i id="settingIcon" class="fa fa-cog"></i>
        <div id="settingContent" class="settings-content">
          <input type="date" id="dobInput" />
          <button id="dobButton">Add Dob</button>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>

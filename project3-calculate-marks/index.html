<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percentage and Marks Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

  <!-- Back to Portfolio Ribbon -->
    <div class="portfolio-ribbon">
      <a href="../index.html" class="back-btn">
        ← Back to Portfolio
      </a>
    </div>

    <div class="background">
      <div class="container">
        <div class="box">
          <form
            onsubmit="calculateMarks(event)"
            class="calculateForm"
            id="calculateForm"
          >
            <input
              type="number"
              min="0"
              max="100"
              placeholder="Maths"
              name="maths"
              required
            />
            <input
              type="number"
              min="0"
              max="100"
              placeholder="English"
              name="english"
              required
            />
            <input
              type="number"
              min="0"
              max="100"
              placeholder="science"
              name="science"
              required
            />
            <input
              type="number"
              min="0"
              max="100"
              placeholder="Social"
              name="social"
              required
            />
            <button type="submit" class="primary-btn">Calculate</button>
          </form>
          <p class="result" id="result"></p>
        </div>
        <div class="content">
          <h2>Calculate Your</h2>
          <h1>Percentage</h1>
        </div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
